[package]
name = "wie-cpu-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
exact-counts = ["replay", "wie-core-arm/cpu-exact-counts"]
transcript-verify = ["replay", "wie-core-arm/cpu-transcript-verify"]
replay = ["wie-core-arm/cpu-replay"]
experimental-thumb-inline = ["wie-core-arm/experimental-thumb-inline"]
experimental-thumb-blocks = ["wie-core-arm/experimental-thumb-blocks"]
experimental-pc-local = ["wie-core-arm/experimental-pc-local"]
experimental-thumb-table = ["wie-core-arm/experimental-thumb-table"]
pc-sampling = ["dep:libc"]
profiling = ["wie-core-arm/cpu-profiling"]
throughput = ["wie-core-arm/cpu-throughput"]

[dependencies]
libc = { version = "0.2", optional = true }
log = { version = "0.4", features = ["release_max_level_warn"] }
serde = { workspace = true }
serde_json = "1.0"
wie-core-arm = { workspace = true, features = ["cpu-benchmark"] }

[[example]]
name = "android_pc_sample"
path = "examples/android_pc_sample.rs"
required-features = ["pc-sampling"]

[[example]]
name = "replay"
path = "examples/replay.rs"
required-features = ["replay"]

[[example]]
name = "replay_counts"
path = "examples/replay_counts.rs"
required-features = ["replay", "throughput"]

[[example]]
name = "transcript"
path = "examples/transcript.rs"
required-features = ["replay"]

[[example]]
name = "transcript_counts"
required-features = ["exact-counts"]

[[example]]
name = "transcript_native_profile"
required-features = ["replay"]
