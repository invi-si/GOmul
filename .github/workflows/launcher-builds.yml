name: GOmul native Android prerelease build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Select installed NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Unit checks
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked
          cargo test -p wie-core-arm --features experimental-thumb-inline,experimental-thumb-table --locked
          python3 scripts/release-audit.py
          python3 -m unittest discover -s tools/mac-checkpoints -v
          python3 -m unittest discover -s tools/compatibility -v
          mkdir -p /tmp/gomul-java-tests
          javac -d /tmp/gomul-java-tests wie-android/android/app/src/main/java/local/wie/nativeapp/{GameDataImport,GameSaveReset,ControllerState}.java wie-android/tests/*.java
          for test in GameDataImportTest GameSaveResetTest ControllerStateTest; do
            java -cp /tmp/gomul-java-tests local.wie.nativeapp.$test
          done
      - name: Build native APK and notices
        run: |
          ./wie-android/build.sh
          ./wie-android/android/gradlew -p wie-android/android :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GOmul-android-arm64-experimental
          path: wie-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
