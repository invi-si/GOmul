[package]
name = "wie-core-arm"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[features]
cpu-exact-counts = ["cpu-transcript-verify", "arm32_cpu/exact-counts"]
cpu-transcript-verify = ["cpu-replay"]
cpu-transcript-capture = ["cpu-replay", "wie-util/input-trace"]
cpu-replay = ["arm32_cpu/serde-serialize"]
experimental-thumb-inline = ["arm32_cpu/experimental-thumb-inline"]
experimental-thumb-blocks = []
experimental-pc-local = ["arm32_cpu/experimental-pc-local"]
experimental-thumb-table = ["arm32_cpu/experimental-thumb-table"]
cpu-throughput = []
cpu-benchmark = []
cpu-profiling = ["arm32_cpu/profiling"]

[dependencies]
async-trait = { workspace = true }
bytemuck = { workspace = true }
md5 = { workspace = true }
serde = { workspace = true }
spin = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

arm32_cpu = { version = "^0.1.0" }

wie-backend = { workspace = true }
wie-util = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gdbstub = { version = "^0.7" }
gdbstub_arch = { version = "^0.3" }
crossbeam = { version = "^0.8" }

[dev-dependencies]
serde_json = "1.0"
futures = { workspace = true, features = ["executor"] }
futures-test = { workspace = true }
test-utils = { workspace = true }
