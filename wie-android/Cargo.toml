[package]
name = "wie-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
cpu-transcript-capture = ["cpu-replay", "wie-core-arm/cpu-transcript-capture", "wie-ktf/cpu-transcript-capture", "wie-lgt/cpu-transcript-capture"]
input-trace = ["wie-util/input-trace", "wie-backend/input-trace", "dep:libc", "dep:serde_json"]
frame-diagnostics = ["dep:tracing-subscriber", "tracing/std"]
cpu-replay = ["dep:wie-core-arm", "wie-core-arm/cpu-replay", "dep:serde_json"]
experimental-thumb-inline = ["wie-lgt/experimental-thumb-inline"]
experimental-thumb-table = ["wie-lgt/experimental-thumb-table"]
native-cpu-bench = ["dep:wie-cpu-bench"]

[dependencies]
anyhow.workspace = true
sha2 = "0.10"
libc = { version = "0.2", optional = true }
async-trait.workspace = true
tracing.workspace = true
log = { version = "0.4", features = ["release_max_level_warn"] }
jni = "0.21.1"
directories = "6.0"
wie-backend = { workspace = true, features = ["checkpoint-replay"] }
wie-util.workspace = true
wie-lgt.workspace = true
wie-ktf.workspace = true
wie-skt.workspace = true
wie-j2me.workspace = true
wie-cpu-bench = { path = "../tools/cpu-bench", optional = true }

[dependencies.wie-core-arm]
workspace = true
optional = true

[dependencies.serde_json]
version = "1.0"
optional = true

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]
optional = true
