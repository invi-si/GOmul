plugins { id 'com.android.application' }
def traceBuild = project.hasProperty('gomulTrace')
android {
    namespace 'local.wie.nativeapp'
    compileSdk 36
    defaultConfig {
        applicationId traceBuild ? 'local.wie.nativeapp.trace' : 'local.wie.nativeapp'
        manifestPlaceholders = [appLabel: traceBuild ? 'GOmul Trace' : 'GOmul', shellProfileable: traceBuild ? 'true' : 'false']
        testInstrumentationRunner "local.wie.nativeapp.RescueInstrumentation"
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug { debuggable true }
        release {
            debuggable false
            if (traceBuild) { signingConfig signingConfigs.debug }
        }
    }
}
